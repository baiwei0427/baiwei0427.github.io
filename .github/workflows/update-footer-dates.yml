name: Update footer dates

on:
  push:
    branches: [master]
    paths-ignore:
      - '*.html'

jobs:
  update-footer-dates:
    if: "github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'chore: update footer dates')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update footer dates
        run: python scripts/update_footer_dates.py
        env:
          TZ: America/Los_Angeles

      - name: Commit and push changes if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- '*.html'; then
            git add *.html
            git commit -m "chore: update footer dates"
            git push origin HEAD:master
          fi
