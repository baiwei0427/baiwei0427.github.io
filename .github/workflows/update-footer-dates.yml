name: Update footer dates

on:
  push:
    branches: [master]

jobs:
  update-footer-dates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update footer dates
        run: python scripts/update_footer_dates.py
        env:
          TZ: America/Los_Angeles

      - name: Create PR if changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- '*.html'; then
            BRANCH="chore/update-footer-$(date +%Y%m%d%H%M%S)"
            git checkout -b "$BRANCH"
            git add *.html
            git commit -m "chore: update footer dates"
            git push origin "$BRANCH"
            gh pr create --title "chore: update footer dates" --body "Auto-generated by GitHub Actions (MAI-Code-1-Flash)" --base master --head "$BRANCH"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
