name: Auto Merge

on:
  workflow_run:
    workflows: ['PR Check']
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  auto-merge-bot:
    if: github.event_name == 'pull_request' && github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Auto merge bot PRs immediately
        # Footer-only bot PRs are merged on open without waiting for CI; this keeps
        # the automated date update flowing, but would be too broad for code changes.
        run: gh pr merge ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --squash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  auto-merge-human:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Get open PRs and merge
        run: |
          PRS=$(gh pr list --repo ${{ github.repository }} --state open --json number,headRefOid --jq '.[] | select(.headRefOid == "${{ github.event.workflow_run.head_sha }}") | .number')
          for pr in $PRS; do
            echo "Merging PR #$pr"
            gh pr merge "$pr" --repo ${{ github.repository }} --squash || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
