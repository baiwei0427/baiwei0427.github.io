name: PR Check

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  pull_request_target:
    branches: [master]

jobs:
  validate-site:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       !(github.actor == 'github-actions[bot]' &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         startsWith(github.event.pull_request.head.ref, 'chore/update-footer-dates-'))) ||
      (github.event_name == 'pull_request_target' &&
       github.actor == 'github-actions[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'chore/update-footer-dates-'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install HTML validator
        run: python -m pip install --upgrade pip html5validator

      - name: Validate HTML
        run: html5validator --root . --also-check-css --format text '*.html'

      - name: Check broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: |
            --exclude "linkedin\.com"
            --exclude "usenix\.org"
            --exclude "dl\.acm\.org"
            --exclude "scholar\.google"
            --exclude "facebook\.com"
            --exclude "zlin1792\.github\.io"
            --exclude "sciencedirect\.com"
            --timeout 15
            --max-retries 2
            '*.html'
