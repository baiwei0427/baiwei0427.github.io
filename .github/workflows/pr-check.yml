name: PR Check

on:
  pull_request:
    branches: [master]

jobs:
  validate-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install HTML validator
        run: python -m pip install --upgrade pip html5validator

      - name: Validate HTML
        run: html5validator --root . --also-check-css --format text '*.html'

      - name: Check broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: |
            --exclude "linkedin\.com"
            --exclude "usenix\.org"
            --exclude "dl\.acm\.org"
            --exclude "scholar\.google"
            --exclude "facebook\.com"
            --timeout 15
            --max-retries 2
            '*.html'
